name: push_images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bot
            file: Dockerfile-bot
            image: baby_domik_bot
          - name: fastapi
            file: Dockerfile-fastapi
            image: baby_domik_fastapi
          - name: migration
            file: Dockerfile-migration
            image: baby_domik_migration
          - name: gspread
            file: Dockerfile-gspread
            image: baby_domik_gspread_worker
          - name: sales
            file: Dockerfile-sales
            image: baby_domik_sales_worker
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max