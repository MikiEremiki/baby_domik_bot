[project]
name = "BabyDomikBot"
version = "5"
authors = [
    { name = "Mikhail Eremin", email = "mr.eremin.ma@ya.ru" },
]
license = { file = "LICENSE" }
description = "Telegram bot on top of python-telegram-bot"
requires-python = ">=3.12"
dependencies = [
    "PyYAML",
    "sqlalchemy[asyncio]",
    "faststream[cli]",
    "nats-py",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
]

bot = [
    "alembic",
    "black",
    "cachetools",
    "psycopg",
    "psycopg-binary",
    "pydantic",
    "pydantic_core",
    "pytest",
    "gspread>=6.2.1",
    "gspread-asyncio>=3.0.0",
    "python-telegram-bot[ext]",
    "pytz",
    "requests",
    "typing_extensions",
    "yookassa",
    "uvicorn",
    "sulguk",
    "fastapi",
]

fastapi = [
    "uvicorn",
    "fastapi",
    "faststream",
    "pydantic",
    "jinja2",
    "itsdangerous",
    "psycopg",
    "psycopg-binary",
    "python-multipart",
    "yookassa",
    "pytz",
    "bleach",
]

gspread = [
    "gspread>=6.2.1",
    "gspread-asyncio>=3.0.0",
    "python-telegram-bot[ext]",
]

sales = [
    "psycopg",
    "psycopg-binary",
    "python-telegram-bot[ext]",
    "pytz",
    "sulguk",
]

migration = [
    "alembic",
    "black",
    "psycopg",
    "psycopg-binary",
    "python-telegram-bot[ext]",
    "pydantic_core",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
norecursedirs = ["certbot", ".git", ".idea", ".junie"]
