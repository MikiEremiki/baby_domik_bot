[project]
name = "BabyDomikBot"
version = "5"
authors = [
    { name = "Mikhail Eremin", email = "mr.eremin.ma@ya.ru" },
]
license = { file = "LICENSE" }
description = "Telegram bot on top of python-telegram-bot"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "black",
    "cachetools",
    "psycopg",
    "psycopg-binary",
    "pydantic",
    "pydantic_core",
    "pydantic-settings",
    "pytest",
    "gspread>=6.2.1",
    "gspread-asyncio>=3.0.0",
    "python-telegram-bot[ext]",
    "pytz",
    "PyYAML",
    "requests",
    "sqlalchemy",
    "typing_extensions",
    "yookassa",
    "uvicorn",
    "fastapi",
    "faststream[cli]",
    "nats-py",
    "bleach>=6.4.0",  # Required by FastAPI: used in api/web/routes/booking.py for HTML sanitization
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
norecursedirs = ["certbot", ".git", ".idea", ".junie"]
